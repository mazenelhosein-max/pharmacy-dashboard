<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>صيدلية ويب - Dashboard</title>
<style>
  body { font-family: sans-serif; background:#f5f5f5; margin:0; padding:20px; }
  h1{ margin-top:0; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:15px; }
  .card{ background:white; padding:15px; border-radius:10px; box-shadow:0 0 5px #0002; }
  button{ padding:5px 10px; margin-top:5px; cursor:pointer; }
  .cart{ background:white; padding:15px; border-radius:10px; box-shadow:0 0 5px #0002; margin-top:20px; }
</style>
</head>
<body>
<h1>لوحة تحكم — صيدلية ويب</h1>

<div class="grid" id="products"></div>

<div class="cart">
  <h2>السلة</h2>
  <div id="cartItems"></div>
  <h3>الإجمالي: <span id="total">0</span> ج.م</h3>
</div>

<script>
// منتجات جاهزة — بدون Backend — تشتغل فوراً
const products = [
  { id:1, name:"Panadol Extra", price:28 },
  { id:2, name:"Vitamin C 500mg", price:70 },
  { id:3, name:"Sunscreen SPF50", price:120 },
  { id:4, name:"Cough Syrup", price:55 }
];

const cart = [];

function renderProducts(){
  const box = document.getElementById("products");
  box.innerHTML = "";
  products.forEach(p=>{
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h3>${p.name}</h3>
      <p>السعر: ${p.price} ج.م</p>
      <button onclick="addToCart(${p.id})">إضافة للسلة</button>
    `;
    box.appendChild(div);
  });
}

function addToCart(id){
  const item = cart.find(i=>i.id===id);
  if(item) item.qty++;
  else{
    const p = products.find(x=>x.id===id);
    cart.push({ id:p.id, name:p.name, price:p.price, qty:1 });
  }
  renderCart();
}

function renderCart(){
  const box = document.getElementById("cartItems");
  box.innerHTML = "";
  let total = 0;
  cart.forEach(i=>{
    total += i.price*i.qty;
    const row = document.createElement("div");
    row.innerHTML = `${i.name} — (${i.qty})`;
    box.appendChild(row);
  });
  document.getElementById("total").innerText = total;
}

renderProducts();
</script>
</body>
</html>
